<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сюжет-Студия</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>Сюжет-Студия</h1>
    <div class="head-actions">
        <button id="btnSaveDraft">Черновик ↓</button>
        <button id="btnLoadDraft">Черновик ↑</button>
        <input type="file" id="draftFile" accept=".json" hidden>
        <select id="csvSep" title="Разделитель столбцов в CSV">
            <option value=";" selected>CSV «;» (Fish Cutter)</option>
            <option value="&#9;">TSV (табуляция)</option>
            <option value=",">CSV «,» (Excel)</option>
        </select>
        <button id="btnExportCsv" class="accent">CSV для Fish Cutter</button>
        <button id="btnExportDoc" class="accent">Word для редактора</button>
    </div>
</header>

<!-- ================== ВЕРХНИЙ РЯД: РЕКВИЗИТЫ | ПЛЕЕР | ФАЙЛЫ ================== -->
<section id="toprow">
    <!-- РЕКВИЗИТЫ -->
    <section id="requisites" class="card">
        <div class="req-names">
            <div><label>Название сюжета</label><input id="storyTitle" placeholder="ОЭМК: кислородная станция"></div>
            <div><label>FPS таймкодов</label><input id="fpsInput" type="number" min="1" max="240" step="any" value="25"
                 title="Частота кадров проекта. 25 / 29.97 / 50… — должна совпадать с секвенцией в Premiere"></div>
            <div>
                <label>Корреспондент</label>
                <div class="nf-row">
                    <select id="fioReporter" data-role="корреспондента"></select>
                    <button class="nf-gear" data-names="fioReporter" title="Изменить и удалить имена">⚙</button>
                </div>
            </div>
            <div>
                <label>Оператор</label>
                <div class="nf-row">
                    <select id="fioCam" data-role="оператора"></select>
                    <button class="nf-gear" data-names="fioCam" title="Изменить и удалить имена">⚙</button>
                </div>
            </div>
            <div>
                <label>Монтажёр</label>
                <div class="nf-row">
                    <select id="fioEditor" data-role="монтажёра"></select>
                    <button class="nf-gear" data-names="fioEditor" title="Изменить и удалить имена">⚙</button>
                </div>
            </div>
        </div>

        <div class="req-folder">
            <label>Папка с исходниками видео</label>
            <div class="row">
                <button id="btnPickFolderCompat" class="accent">Исходники</button>
                <span id="folderName" class="muted">не выбрана</span>
            </div>
        </div>
    </section>

    <!-- ПЛЕЕР -->
    <section id="playercol">
        <div class="monitor">
            <video id="player" preload="metadata"></video>

            <div class="tc-line">
                <span id="curTc" class="tc" title="Текущая позиция">00:00:00:00</span>
                <span class="spacer"></span>
                <span class="muted" id="fileDur">длительность —</span>
            </div>

            <div id="scrubber" class="scrubber" title="Клик/перетаскивание — перемотка; края зоны — перетаскивание входа/выхода">
                <div class="scrub-track"></div>
                <div id="scrubSel" class="scrub-sel" hidden></div>
                <div id="scrubPlay" class="scrub-play" hidden></div>
                <div id="scrubInH" class="scrub-handle h-in" hidden title="In — тянуть"></div>
                <div id="scrubOutH" class="scrub-handle h-out" hidden title="Out — тянуть"></div>
            </div>

            <div class="transport">
                <button id="btnGoIn" title="К In (Shift+I)" disabled>⏮</button>
                <button id="btnInBack1f" title="In −1 кадр">⏴|</button>
                <button id="btnInFwd1f" title="In +1 кадр">|⏵</button>
                <button id="btnPlay" class="tp-play" title="Play/Pause (пробел)">▶</button>
                <button id="btnOutBack1f" title="Out −1 кадр">⏴|</button>
                <button id="btnOutFwd1f" title="Out +1 кадр">|⏵</button>
                <button id="btnGoOut" title="К Out (Shift+O)" disabled>⏭</button>
                <button id="btnPreview" title="Циклический предпросмотр In→Out (P)">⟳ P</button>
                <span class="spacer"></span>
                <button id="btnSetIn" class="mark" title="Поставить In (I)">[ In</button>
                <button id="btnSetOut" class="mark" title="Поставить Out (O)">Out ]</button>
                <button id="btnClearMarks" title="Сбросить к краям файла">✕</button>
            </div>

            <details class="keys">
                <summary>Горячие клавиши</summary>
                <ul>
                    <li>I / O — In / Out; Shift+I / Shift+O — перейти к метке</li>
                    <li>← → — шаг на кадр; Shift+← → — на секунду</li>
                    <li>Пробел — пауза; P — циклический предпросмотр In→Out</li>
                    <li>Esc — очистить поиск по файлам</li>
                </ul>
            </details>

            <div class="row send">
                <label>В блок:</label>
                <select id="targetBlock"></select>
                <label>как</label>
                <select id="sendMode" title="Тип нового блока, если выбран «+ новый»">
                    <option value="vo">Закадровый</option>
                    <option value="standup">Стендап</option>
                    <option value="sync">Часть синхрона</option>
                    <option value="life">Лайф</option>
                    <option value="spiegel">Шпигель</option>
                    <option value="vod">Подводка</option>
                </select>
                <button id="btnSend" class="accent">В сценарий →</button>
            </div>
        </div>
    </section>

    <!-- БРАУЗЕР ФАЙЛОВ -->
    <section id="browser" class="card">
        <h2>Файлы</h2>
        <div class="row">
            <button id="btnRescan">Обновить список</button>
            <input type="search" id="videoSearch" placeholder="Поиск по имени…" style="flex:1; min-width:0">
            <span class="view-toggle">
                <button id="viewList" title="Списком">☰</button>
                <button id="viewThumbs" title="Миниатюры">▦</button>
                <button id="viewBig" title="Большие миниатюры">▣</button>
            </span>
        </div>
        <div id="videoList" class="vl-list"></div>
    </section>
</section>

<main>
    <!-- ================== СЦЕНАРИЙ ================== -->
    <section id="left">
        <div class="row">
            <button id="btnAddSpiegel" class="btn-spiegel">+ Шпигель</button>
            <button id="btnAddVod" class="btn-vod">+ Подводка</button>
            <button id="btnAddStandup" class="btn-standup">+ Стендап</button>
            <button id="btnAddVO" class="btn-vo">+ Закадровый</button>
            <button id="btnAddSync" class="btn-sync">+ Синхрон</button>
            <button id="btnAddLife" class="btn-life">+ Лайф</button>
            <span class="spacer"></span>
            <span id="totalDur" class="muted"></span>
        </div>
        <div id="blocks"></div>
    </section>
</main>

<div id="toast"></div>

<!-- ============ модалка управления именами (ФИО) ============ -->
<div id="namesModal" class="modal" hidden>
    <div class="modal-box">
        <div class="modal-head">
            <h2>Имена в списках</h2>
            <button id="nmClose" class="icon-x" title="Закрыть (Esc)">✕</button>
        </div>
        <div class="nm-tabs" id="nmTabs"></div>
        <p class="muted" id="nmHint"></p>
        <div class="nm-list" id="nmList"></div>
        <div class="row">
            <input id="nmAdd" placeholder="Новое имя…" style="flex:1; min-width:0">
            <button id="nmAddBtn" class="accent">+ Добавить в общий</button>
        </div>
    </div>
</div>
<script src="js/app.js"></script>
</body>
</html>
