name: CI

on:
  push:
  pull_request:

jobs:
  test-js:
    name: JS-тесты (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Прогнать unit-тесты (зелёный набор)
        run: node --test tests/storage.test.cjs tests/theme.test.cjs tests/word-media.test.cjs
      - name: UI-тесты (известно сломаны на main, не блокирует)
        # ui.test.cjs ссылается на фрагменты octopus.js, которых нет в app.js
        # (REQ_IDS.forEach(...) — октопусный блок), поэтому section() не находит
        # маркер. Отдельный шаг: не блокирует CI, но показывает статус владельцу.
        continue-on-error: true
        run: node --test tests/ui.test.cjs

  test-python:
    name: Python-тесты (pytest server.py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Установить зависимости
        run: python -m pip install --disable-pip-version-check pytest
      - name: Прогнать pytest
        run: python -m pytest tests/test_server.py -q